[package]
name = "hoist"
version = "0.3.0"
edition = "2021"
authors = ["awk studios"]
description = "HOIST: upward + downward level compressor, zero latency, tiny CPU"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# AWKNODE: our nice-plug fork (codeberg RustAudio/nice-plug + awk studios patches), mounted at /nice-plug-awk by build.sh
nice-plug = { path = "/nice-plug-awk/crates/nice-plug" }
nice-plug-egui = { path = "/nice-plug-awk/crates/nice-plug-egui" }
serde_json = "1"
egui = { version = "0.37.0", default-features = false, features = ["bytemuck"] }

[profile.release]
lto = "thin"
strip = "symbols"

# FL Studio fixes: patched baseview (vsync, paint, DPI, dummy-window crash). See nice-plug-awk/patches.
[patch.crates-io]
baseview = { path = "/nice-plug-awk/patches/baseview-0.4.2" }
